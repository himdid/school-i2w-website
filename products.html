<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery | Products</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <!-- Site header and navigation -->
    <header>
        <img src="assets/images/bakery-logo_c.png" alt="North Star Bakery logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Single h1 for products page -->
        <h1>Our Bakery Menu</h1>

        <!-- Signature highlight section -->
        <section>
            <h2>Fresh Breads</h2>
            <figure>
                <img src="assets/images/bakery-signature-loaf_c.png" alt="A freshly baked round loaf of sourdough bread with scored crust">
                <figcaption>Our Signature Sourdough Loaf, baked fresh daily.</figcaption>
            </figure>
            <img src="assets/images/bakery-bread_c.png" alt="A display rack full of baked bread loaves">
        </section>

        <!-- Interactive menu catalog section with client storage -->
        <section id="menu-catalog-section">
            <h2>Browse Offerings</h2>
            <p>Filter our baked goods by category. Your selected preference is saved automatically for your next visit.</p>

            <div id="filter-controls" class="filter-controls">
                <button type="button" class="filter-btn active" data-category="all">All Items</button>
                <button type="button" class="filter-btn" data-category="breads">Fresh Breads</button>
                <button type="button" class="filter-btn" data-category="pastries">Pastries & Breakfast</button>
                <button type="button" class="filter-btn" data-category="cakes">Cakes</button>
            </div>

            <!-- DOM target for dynamic card generation -->
            <div id="product-list" class="card-container"></div>
        </section>
    </main>

    <!-- Standard site footer -->
    <footer>
        <p>&copy; 2026 North Star Bakery</p>
    </footer>
</body>
</html>
